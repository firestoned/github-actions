name: 'Trivy Container Security Scan'
description: 'Scans container images with Trivy for vulnerabilities and uploads results to GitHub Security'
author: 'Erick Bourgeois <erick@firestoned.io>'

branding:
  icon: 'shield'
  color: 'purple'

inputs:
  image-ref:
    description: 'Container image reference to scan (e.g., ghcr.io/org/repo:tag)'
    required: true
  severity:
    description: 'Comma-separated list of severity levels to scan for (CRITICAL,HIGH,MEDIUM,LOW,UNKNOWN)'
    required: false
    default: 'CRITICAL,HIGH'
  exit-code:
    description: 'Exit code when vulnerabilities are found (0 = continue, 1 = fail)'
    required: false
    default: '0'
  sarif-category:
    description: 'Category name for SARIF upload to GitHub Security tab'
    required: false
    default: 'trivy-container-scan'
  upload-artifact-name:
    description: 'Name for the Trivy scan report artifact'
    required: false
    default: 'trivy-scan-report'
  output-filename:
    description: 'Filename for the JSON output report'
    required: false
    default: 'trivy-results.json'

runs:
  using: 'composite'
  steps:
    - name: Run Trivy vulnerability scanner (SARIF output)
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      continue-on-error: true
      with:
        image-ref: ${{ inputs.image-ref }}
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: ${{ inputs.severity }}

    - name: Upload Trivy results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3.36.2
      if: always()
      continue-on-error: true
      with:
        sarif_file: trivy-results.sarif
        category: ${{ inputs.sarif-category }}

    - name: Run Trivy vulnerability scanner (JSON output)
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      if: always()
      with:
        image-ref: ${{ inputs.image-ref }}
        format: 'json'
        output: ${{ inputs.output-filename }}
        severity: ${{ inputs.severity }}
        exit-code: ${{ inputs.exit-code }}

    - name: Upload Trivy JSON report as artifact
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.upload-artifact-name }}
        path: ${{ inputs.output-filename }}

    - name: Generate step summary
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        echo "### Trivy Security Scan Results" >> "${GITHUB_STEP_SUMMARY}"
        echo "| Field | Value |" >> "${GITHUB_STEP_SUMMARY}"
        echo "|-------|-------|" >> "${GITHUB_STEP_SUMMARY}"
        echo "| Image | \`${{ inputs.image-ref }}\` |" >> "${GITHUB_STEP_SUMMARY}"
        echo "| Severity | \`${{ inputs.severity }}\` |" >> "${GITHUB_STEP_SUMMARY}"
        echo "| Report | \`${{ inputs.output-filename }}\` |" >> "${GITHUB_STEP_SUMMARY}"
        if [ -f "${{ inputs.output-filename }}" ]; then
          echo "| Status | Scan complete |" >> "${GITHUB_STEP_SUMMARY}"
        else
          echo "| Status | No report generated |" >> "${GITHUB_STEP_SUMMARY}"
        fi
