name: 'Publish Rust Crate'
description: 'Publish a Rust crate to crates.io, supporting both workspace and standalone crates'
author: 'Erick Bourgeois'

branding:
  icon: 'upload-cloud'
  color: 'orange'

inputs:
  package:
    description: 'Package name to publish (for workspace crates, use --package flag)'
    required: false
    default: ''
  workspace:
    description: 'Whether this is a workspace crate (uses --package flag)'
    required: false
    default: 'false'
  token:
    description: 'crates.io API token (usually from secrets.CARGO_REGISTRY_TOKEN)'
    required: true
  allow-dirty:
    description: 'Allow publishing with uncommitted changes'
    required: false
    default: 'true'
  dry-run:
    description: 'Perform a dry run without actually publishing'
    required: false
    default: 'false'
  cargo-args:
    description: 'Additional arguments to pass to cargo publish'
    required: false
    default: ''

outputs:
  publish-status:
    description: 'Publish status: "published" or "dry-run"'
    value: ${{ steps.publish-crate.outputs.publish-status }}

runs:
  using: 'composite'
  steps:
    - name: Verify Rust toolchain
      uses: firestoned/github-actions/rust/verify-toolchain@main
      with:
        require-cargo: true

    - name: Login to crates.io
      shell: bash
      env:
        CARGO_REGISTRY_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        # Use cargo login with token from environment variable via stdin
        # This is the recommended approach instead of --token flag (avoids shell history exposure)
        echo "${CARGO_REGISTRY_TOKEN}" | cargo login --stdin

    - name: Publish crate
      id: publish-crate
      shell: bash
      run: |
        set -euo pipefail

        # Build cargo command
        # Note: Authentication is handled by cargo login step above
        cmd="cargo publish"

        # Add package flag for workspace crates
        if [ "${{ inputs.workspace }}" = "true" ] && [ -n "${{ inputs.package }}" ]; then
          cmd="${cmd} --package ${{ inputs.package }}"
          echo "Publishing workspace crate: ${{ inputs.package }}"
        elif [ -n "${{ inputs.package }}" ]; then
          echo "WARNING: package specified but workspace=false. The package flag requires workspace=true."
          echo "Publishing current crate in directory"
        else
          echo "Publishing current crate"
        fi

        # Add allow-dirty flag
        if [ "${{ inputs.allow-dirty }}" = "true" ]; then
          cmd="${cmd} --allow-dirty"
        fi

        # Add dry-run flag
        if [ "${{ inputs.dry-run }}" = "true" ]; then
          cmd="${cmd} --dry-run"
          echo "DRY RUN MODE: Not actually publishing to crates.io"
        fi

        # Add any additional cargo arguments
        if [ -n "${{ inputs.cargo-args }}" ]; then
          cmd="${cmd} ${{ inputs.cargo-args }}"
        fi

        echo "Running: ${cmd}"
        ${cmd}

        if [ "${{ inputs.dry-run }}" = "true" ]; then
          echo ""
          echo "✓ Dry run completed successfully"
          echo "publish-status=dry-run" >> "${GITHUB_OUTPUT}"
        else
          echo ""
          echo "✓ Published to crates.io successfully"
          echo "publish-status=published" >> "${GITHUB_OUTPUT}"
        fi

    - name: Generate step summary
      shell: bash
      run: |
        set -euo pipefail
        echo "### Publish Rust Crate" >> "${GITHUB_STEP_SUMMARY}"
        echo "| Field | Value |" >> "${GITHUB_STEP_SUMMARY}"
        echo "|-------|-------|" >> "${GITHUB_STEP_SUMMARY}"
        if [ -n "${{ inputs.package }}" ]; then
          echo "| Package | \`${{ inputs.package }}\` |" >> "${GITHUB_STEP_SUMMARY}"
        fi
        if [ "${{ inputs.dry-run }}" = "true" ]; then
          echo "| Mode | Dry run (not published) |" >> "${GITHUB_STEP_SUMMARY}"
          echo "| Status | ✅ Dry run successful |" >> "${GITHUB_STEP_SUMMARY}"
        else
          echo "| Registry | crates.io |" >> "${GITHUB_STEP_SUMMARY}"
          echo "| Status | ✅ Published successfully |" >> "${GITHUB_STEP_SUMMARY}"
        fi
