name: 'Generate SBOM'
description: 'Generate Software Bill of Materials (SBOM) in CycloneDX format using default naming conventions'
author: 'Erick Bourgeois <erick@firestoned.io>'

branding:
  icon: 'file-text'
  color: 'blue'

inputs:
  format:
    description: 'Output format: json, xml, or both'
    required: false
    default: 'json'
  cyclonedx-version:
    description: 'Version of cargo-cyclonedx to use'
    required: false
    default: '0.5.7'
  describe:
    description: 'What to describe in SBOM: crate (entire crate with targets as subcomponents), binaries (separate SBOM per binary), or all-cargo-targets (separate SBOM per Cargo target)'
    required: false
    default: 'crate'
  target:
    description: 'Optional Rust target triple (e.g., x86_64-unknown-linux-gnu)'
    required: false
    default: ''
  package:
    description: >-
      Workspace package to generate the SBOM for. cargo-cyclonedx 0.5.x has no
      --package flag, so this is resolved to that package's --manifest-path
      via cargo metadata. cargo-cyclonedx still writes an SBOM into every
      workspace member's directory; take the one in this package's directory.
    required: false
    default: ''
  workspace:
    description: 'Generate SBOM for all workspace members'
    required: false
    default: 'false'
  spec-version:
    description: >-
      CycloneDX specification version to emit (cargo-cyclonedx 0.5.x accepts
      1.3, 1.4 or 1.5). Empty keeps the tool default (1.3).
    required: false
    default: ''
  extra-args:
    description: 'Additional arguments to pass to cargo cyclonedx'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Verify Rust toolchain
      uses: firestoned/github-actions/rust/verify-toolchain@main
      with:
        require-cargo: true

    - name: Cache cargo-cyclonedx
      id: cache-cyclonedx
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cargo/bin/cargo-cyclonedx
        key: ${{ runner.os }}-cargo-cyclonedx-${{ inputs.cyclonedx-version }}
        restore-keys: |
          ${{ runner.os }}-cargo-cyclonedx-

    - name: Install cargo-cyclonedx
      if: steps.cache-cyclonedx.outputs.cache-hit != 'true'
      shell: bash
      env:
        CYCLONEDX_VERSION: ${{ inputs.cyclonedx-version }}
      run: cargo install cargo-cyclonedx --locked --version "${CYCLONEDX_VERSION}"

    - name: Generate SBOM
      shell: bash
      env:
        SBOM_FORMAT: ${{ inputs.format }}
        SBOM_DESCRIBE: ${{ inputs.describe }}
        SBOM_TARGET: ${{ inputs.target }}
        SBOM_PACKAGE: ${{ inputs.package }}
        SBOM_WORKSPACE: ${{ inputs.workspace }}
        SBOM_SPEC_VERSION: ${{ inputs.spec-version }}
        SBOM_EXTRA_ARGS: ${{ inputs.extra-args }}
      run: |
        set -euo pipefail
        # Inputs arrive through env, never interpolated into the script.
        args=(--all --describe "${SBOM_DESCRIBE}")

        if [ "${SBOM_WORKSPACE}" != "true" ] && [ -n "${SBOM_PACKAGE}" ]; then
          # cargo-cyclonedx 0.5.x has no --package: point it at the package's
          # manifest instead.
          manifest=$(cargo metadata --no-deps --format-version 1 \
            | jq -r --arg pkg "${SBOM_PACKAGE}" \
                '.packages[] | select(.name == $pkg) | .manifest_path')
          if [ -z "${manifest}" ]; then
            echo "Error: package '${SBOM_PACKAGE}' is not in this workspace"
            exit 1
          fi
          args+=(--manifest-path "${manifest}")
          echo "Generating SBOM for package: ${SBOM_PACKAGE} (${manifest})"
        else
          echo "Generating SBOM for the workspace / current crate"
        fi

        if [ -n "${SBOM_TARGET}" ]; then
          args+=(--target "${SBOM_TARGET}")
          echo "Target: ${SBOM_TARGET}"
        fi

        if [ -n "${SBOM_SPEC_VERSION}" ]; then
          args+=(--spec-version "${SBOM_SPEC_VERSION}")
          echo "CycloneDX spec version: ${SBOM_SPEC_VERSION}"
        fi

        if [ -n "${SBOM_EXTRA_ARGS}" ]; then
          # Word-split on purpose: extra-args is a list of flags.
          read -r -a extra <<< "${SBOM_EXTRA_ARGS}"
          args+=("${extra[@]}")
        fi

        echo "Describe mode: ${SBOM_DESCRIBE}"

        if [ "${SBOM_FORMAT}" = "json" ] || [ "${SBOM_FORMAT}" = "both" ]; then
          echo "Generating SBOM in JSON format..."
          cargo cyclonedx "${args[@]}" --format json
        fi

        if [ "${SBOM_FORMAT}" = "xml" ] || [ "${SBOM_FORMAT}" = "both" ]; then
          echo "Generating SBOM in XML format..."
          cargo cyclonedx "${args[@]}" --format xml
        fi

        # cargo-cyclonedx writes <crate>.cdx.<fmt> into each package directory
        # (the repo root for a single crate).
        echo ""
        echo "Generated SBOM files:"
        find . -name "*.cdx.*" -not -path "*/target/*" -not -path "*/.git/*" -type f \
          -exec ls -lh {} \;

        total_sboms=$(find . -name "*.cdx.*" -not -path "*/target/*" -not -path "*/.git/*" -type f | wc -l | tr -d ' ')
        echo "Total SBOMs generated: ${total_sboms}"
        if [ "${total_sboms}" -eq 0 ]; then
          echo "Error: No SBOM files were generated"
          exit 1
        fi
