name: 'Package Rust Crate'
description: 'Package a Rust crate for publishing to crates.io, supporting both workspace and standalone crates'
author: 'Erick Bourgeois'

branding:
  icon: 'package'
  color: 'orange'

inputs:
  package:
    description: 'Package name to package (for workspace crates, use --package flag)'
    required: false
    default: ''
  workspace:
    description: 'Whether this is a workspace crate (uses --package flag)'
    required: false
    default: 'false'
  allow-dirty:
    description: 'Allow packaging with uncommitted changes'
    required: false
    default: 'true'
  cargo-args:
    description: 'Additional arguments to pass to cargo package'
    required: false
    default: ''

outputs:
  crate-path:
    description: 'Path to the packaged .crate file (first found in target/package/)'
    value: ${{ steps.package-crate.outputs.crate-path }}
  crate-name:
    description: 'Filename of the packaged .crate file'
    value: ${{ steps.package-crate.outputs.crate-name }}

runs:
  using: 'composite'
  steps:
    - name: Verify Rust toolchain
      uses: firestoned/github-actions/rust/verify-toolchain@main
      with:
        require-cargo: true

    - name: Package crate
      id: package-crate
      shell: bash
      run: |
        set -euo pipefail

        # Build cargo command
        cmd="cargo package --verbose"

        # Add package flag for workspace crates
        if [ "${{ inputs.workspace }}" = "true" ] && [ -n "${{ inputs.package }}" ]; then
          cmd="${cmd} --package ${{ inputs.package }}"
          echo "Packaging workspace crate: ${{ inputs.package }}"
        elif [ -n "${{ inputs.package }}" ]; then
          echo "WARNING: package specified but workspace=false. The package flag requires workspace=true."
          echo "Packaging current crate in directory"
        else
          echo "Packaging current crate"
        fi

        # Add allow-dirty flag
        if [ "${{ inputs.allow-dirty }}" = "true" ]; then
          cmd="${cmd} --allow-dirty"
        fi

        # Add any additional cargo arguments
        if [ -n "${{ inputs.cargo-args }}" ]; then
          cmd="${cmd} ${{ inputs.cargo-args }}"
        fi

        echo "Running: ${cmd}"
        ${cmd}

        echo ""
        echo "Package created successfully"

        # List the packaged crate and capture path/name outputs
        if [ -d "target/package" ] && compgen -G "target/package/*.crate" > /dev/null 2>&1; then
          echo ""
          echo "Packaged crate(s):"
          crate_path=""
          for file in target/package/*.crate; do
            ls -lh "${file}"
            if [ -z "${crate_path}" ]; then
              crate_path="${file}"
            fi
          done
          crate_name=$(basename "${crate_path}")
          echo "crate-path=${crate_path}" >> "${GITHUB_OUTPUT}"
          echo "crate-name=${crate_name}" >> "${GITHUB_OUTPUT}"
        else
          echo "No .crate files found in target/package"
          exit 1
        fi

    - name: Generate step summary
      shell: bash
      run: |
        set -euo pipefail
        echo "### Package Rust Crate" >> "${GITHUB_STEP_SUMMARY}"
        echo "| Field | Value |" >> "${GITHUB_STEP_SUMMARY}"
        echo "|-------|-------|" >> "${GITHUB_STEP_SUMMARY}"
        if [ -n "${{ inputs.package }}" ]; then
          echo "| Package | \`${{ inputs.package }}\` |" >> "${GITHUB_STEP_SUMMARY}"
        fi
        echo "| Crate | \`${{ steps.package-crate.outputs.crate-name }}\` |" >> "${GITHUB_STEP_SUMMARY}"
        echo "| Path | \`${{ steps.package-crate.outputs.crate-path }}\` |" >> "${GITHUB_STEP_SUMMARY}"
        echo "| Status | ✅ Packaged successfully |" >> "${GITHUB_STEP_SUMMARY}"
