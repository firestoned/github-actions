name: 'Extract Version Information'
description: 'Extracts version, tag name, and image tags for consistent use across workflows'
author: 'Erick Bourgeois'

branding:
  icon: 'tag'
  color: 'blue'

inputs:
  repository:
    description: 'Repository name (e.g., firestoned/myapp) - used for image repository naming'
    required: true
  workflow-type:
    description: 'Workflow type: main, pr, or release'
    required: true
  pr-number:
    description: 'PR number (only for pr workflow)'
    required: false
  release-tag:
    description: 'Release tag name (only for release workflow)'
    required: false
  image-tag-suffix:
    description: 'Suffix to append to the image tag (e.g., "-distroless")'
    required: false
    default: ''

outputs:
  version:
    description: 'Semantic version (e.g., 1.2.3)'
    value: ${{ steps.extract.outputs.version }}
  tag-name:
    description: 'Git tag name (e.g., v1.2.3)'
    value: ${{ steps.extract.outputs.tag-name }}
  image-tag:
    description: 'Docker image tag (e.g., main-2025.12.17, pr-42, v0.2.0)'
    value: ${{ steps.extract.outputs.image-tag }}
  image-repository:
    description: 'Docker repository name (e.g., firestoned/myapp)'
    value: ${{ steps.extract.outputs.image-repository }}
  short-sha:
    description: 'Short 7-character SHA'
    value: ${{ steps.extract.outputs.short-sha }}

runs:
  using: 'composite'
  steps:
    - name: Extract version information
      id: extract
      shell: bash
      # Every input reaches the script through the environment, never by `${{ }}` in the script:
      # a release tag's name, a repository name or a suffix may hold shell syntax, and a value
      # with a line break would add an output of its own choosing. Each is checked before use.
      env:
        GIT_SHA: ${{ github.sha }}
        RUN_NUMBER: ${{ github.run_number }}
        IMAGE_REPOSITORY: ${{ inputs.repository }}
        IMAGE_TAG_SUFFIX: ${{ inputs.image-tag-suffix }}
        WORKFLOW_TYPE: ${{ inputs.workflow-type }}
        RELEASE_TAG: ${{ inputs.release-tag }}
        PR_NUMBER: ${{ inputs.pr-number }}
      run: |
        set -euo pipefail
        fail() { echo "::error::$1"; exit 1; }

        # A repository is owner/name (letters, digits, '.', '_', '-'); a suffix is empty or
        # starts with '-' and holds what a container image tag may.
        [[ "$IMAGE_REPOSITORY" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]] \
          || fail "repository is not owner/name: refusing it"
        [[ -z "$IMAGE_TAG_SUFFIX" || "$IMAGE_TAG_SUFFIX" =~ ^-[A-Za-z0-9._-]{1,64}$ ]] \
          || fail "image-tag-suffix is not empty or -<letters, digits, . _ ->: refusing it"

        SHORT_SHA="${GIT_SHA:0:7}"
        {
          echo "short-sha=${SHORT_SHA}"
          echo "image-repository=${IMAGE_REPOSITORY}"
        } >> "$GITHUB_OUTPUT"

        case "$WORKFLOW_TYPE" in
          release)
            # Release workflow: the version is the tag without its leading v.
            # Tag format: v1.2.3, with an optional -prerelease and +build.
            [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]] \
              || fail "release-tag is not v<major>.<minor>.<patch>[-pre][+build]: refusing it"
            TAG_NAME="$RELEASE_TAG"
            VERSION="${TAG_NAME#v}"
            # A container tag cannot hold '+': build metadata is dropped from the image tag only.
            IMAGE_TAG="${TAG_NAME%%+*}${IMAGE_TAG_SUFFIX}"
            ;;

          pr)
            # PR workflow: use pr-NUMBER format
            # Tag format: pr-42
            [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || fail "pr-number is not a number: refusing it"
            VERSION="pr-${PR_NUMBER}"
            TAG_NAME="pr-${PR_NUMBER}"
            IMAGE_TAG="pr-${PR_NUMBER}${IMAGE_TAG_SUFFIX}"
            ;;

          main)
            # Main branch: use main-YYYY.MM.DD format
            # Tag format: main-2025.12.17
            DATE=$(date +%Y.%m.%d)
            VERSION="0.0.0-main.${DATE}.${RUN_NUMBER}"
            TAG_NAME="main-${DATE}"
            IMAGE_TAG="main-${DATE}${IMAGE_TAG_SUFFIX}"
            ;;

          *)
            fail "invalid workflow-type: must be main, pr, or release"
            ;;
        esac

        {
          echo "version=${VERSION}"
          echo "tag-name=${TAG_NAME}"
          echo "image-tag=${IMAGE_TAG}"
        } >> "$GITHUB_OUTPUT"
        echo "${WORKFLOW_TYPE}: version=${VERSION}, tag=${TAG_NAME}, image=${IMAGE_REPOSITORY}:${IMAGE_TAG}"
